name: Daily price refresh

on:
  schedule:
    # 02:00 UTC = 11:00 JST。
    # 以前は 01:00 UTC(10:00 JST)だったが、9/15〜9/18の記録を見ると、朝の取得値は
    # 毎回「前日15時の取得値」と一致しており、価格が動くのは午後の取得時だけだった。
    # 田中貴金属の建値は9:30ごろ公表で、それに合わせて朝のうちに価格を更新する店がある
    # (コメ兵はそう運用していると聞いている)。10:17時点で変化が見えないということは、
    # 朝の更新に対して取得が早すぎた可能性が高い。1時間遅らせて様子を見る。
    # これより早めると、朝10:00ちょうどに更新するリファスタ等で前日の値を拾う。
    - cron: "0 2 * * *"
    # 06:00 UTC = 15:00 JST。午後に価格を動かす店(コメ兵は14時ごろ、ただし時刻は一定でない)
    # を拾うための2回目。朝の実行が一時的な失敗(403等)で取れなかった会社の拾い直しも兼ねる。
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # 1社の取得失敗が他社やこの後のコミットをブロックしないよう、各ステップは失敗しても続行する。
      - name: 各社の買取価格を取得
        run: node scripts/scrape/index.mjs
        continue-on-error: true

      - name: 田中貴金属の参考価格を取得
        run: node scripts/scrape/update-reference-rate.mjs
        continue-on-error: true

      - name: 日次平均価格を履歴に追記
        run: node scripts/scrape/append-history.mjs
        continue-on-error: true

      - name: 金先物の見通しを記録
        run: node scripts/scrape/record-futures-outlook.mjs
        continue-on-error: true

      - name: 変更をコミット・push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "変更なし" || git commit -m "chore: 日次価格更新 $(date -u +%Y-%m-%d)"
          git push

      # ここまでの各ステップは continue-on-error なので、1社の取得が失敗しても
      # ジョブは緑のまま終わっていた。実際なんぼやの取得は10か月失敗し続け、
      # その間ずっと古い価格がサイトに並んでいた。ログに出すだけでは気づけない。
      # コミットの後に置くのは、点検で落としても当日取れた分は残したいため。
      - name: 取得結果を点検(失敗・古い価格があればジョブを落とす)
        if: always()
        run: node scripts/scrape/check-freshness.mjs
