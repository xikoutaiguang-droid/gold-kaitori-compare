name: Daily price refresh

on:
  schedule:
    # 毎時00分を避けて3回に分ける。
    #
    # GitHubのスケジュール実行は保証ではなく、負荷が高いと遅延・破棄される。
    # 毎時00分は世界中のワークフローが集中するので、いちばん落ちやすい。
    # 実測: 9/22に "0 2" と "0 6" へ変えて以降、"0 2" の回は一度も実行されず、
    # "0 6" の回も4時間半遅れ(9/22)、1時間39分遅れ(9/23)と悪化し、
    # 9/24はどちらも実行されなかった。00分から外し、回数を2回から3回に増やす。
    #
    # 各ステップは何度実行しても同じ結果になる(同じ日の記録は上書き、
    # 変更が無ければコミットもしない)ので、3回走っても副作用はない。
    #
    # 11:23 JST。田中貴金属の建値が9:30ごろ公表され、それに合わせて
    # 朝のうちに価格を更新する店を拾う。
    - cron: "23 2 * * *"
    # 15:17 JST。午後に価格を動かす店(コメ兵は14時ごろ、ただし時刻は一定でない)。
    - cron: "17 6 * * *"
    # 18:47 JST。前の2回が落とされた日の取りこぼしを拾う最後の機会。
    - cron: "47 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # 1社の取得失敗が他社やこの後のコミットをブロックしないよう、各ステップは失敗しても続行する。
      - name: 各社の買取価格を取得
        run: node scripts/scrape/index.mjs
        continue-on-error: true

      - name: 田中貴金属の参考価格を取得
        run: node scripts/scrape/update-reference-rate.mjs
        continue-on-error: true

      - name: 日次平均価格を履歴に追記
        run: node scripts/scrape/append-history.mjs
        continue-on-error: true

      # 平均だけでは「この店が先週いくらだったか」が出せないので、社別も残す。
      - name: 社別の価格を履歴に追記
        run: node scripts/scrape/append-company-history.mjs
        continue-on-error: true

      - name: 金先物の見通しを記録
        run: node scripts/scrape/record-futures-outlook.mjs
        continue-on-error: true

      - name: 変更をコミット・push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "変更なし" || git commit -m "chore: 日次価格更新 $(date -u +%Y-%m-%d)"
          # 人間の作業中に走ると push が弾かれ、その日の取得ぶんが失われていた。
          # リベースしてから数回やり直す。
          for i in 1 2 3; do
            git push && exit 0
            echo "push に失敗しました。リベースして再試行します ($i/3)"
            git pull --rebase --autostash origin main || true
            sleep 5
          done
          git push

      # ここまでの各ステップは continue-on-error なので、1社の取得が失敗しても
      # ジョブは緑のまま終わっていた。実際なんぼやの取得は10か月失敗し続け、
      # その間ずっと古い価格がサイトに並んでいた。ログに出すだけでは気づけない。
      # コミットの後に置くのは、点検で落としても当日取れた分は残したいため。
      - name: 取得結果を点検(失敗・古い価格があればジョブを落とす)
        if: always()
        run: node scripts/scrape/check-freshness.mjs
