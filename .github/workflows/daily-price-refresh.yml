name: Daily price refresh

on:
  schedule:
    # 毎時00分を避けて3回に分ける。
    #
    # GitHubのスケジュール実行は保証ではなく、負荷が高いと遅延・破棄される。
    # 毎時00分は世界中のワークフローが集中するので、いちばん落ちやすい。
    # 実測: 9/22に "0 2" と "0 6" へ変えて以降、"0 2" の回は一度も実行されず、
    # "0 6" の回も4時間半遅れ(9/22)、1時間39分遅れ(9/23)と悪化し、
    # 9/24はどちらも実行されなかった。00分から外し、回数を2回から3回に増やす。
    #
    # 各ステップは何度実行しても同じ結果になる(同じ日の記録は上書き、
    # 変更が無ければコミットもしない)ので、3回走っても副作用はない。
    #
    # 11:23 JST。田中貴金属の建値が9:30ごろ公表され、それに合わせて
    # 朝のうちに価格を更新する店を拾う。
    - cron: "23 2 * * *"
    # 15:17 JST。午後に価格を動かす店(コメ兵は14時ごろ、ただし時刻は一定でない)。
    - cron: "17 6 * * *"
    # 18:47 JST。前の2回が落とされた日の取りこぼしを拾う最後の機会。
    - cron: "47 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # 取得より先に、前回までの結果がちゃんと公開されているかを見る。
      # 2026年10月1日、VercelとGitHubの接続が切れてデプロイが21時間作られず、
      # 本番は前日の価格を出し続けていた。このジョブは毎日成功していたし
      # データも正しく更新されていたので、どの点検にも引っかからなかった。
      # continue-on-error にしない。公開が止まっているのは、取得の失敗より重い。
      - name: 公開中のサイトを点検
        run: node scripts/check-production.mjs

      # 1社の取得失敗が他社やこの後のコミットをブロックしないよう、各ステップは失敗しても続行する。
      - name: 各社の買取価格を取得
        run: node scripts/scrape/index.mjs
        continue-on-error: true

      - name: 田中貴金属の参考価格を取得
        run: node scripts/scrape/update-reference-rate.mjs
        continue-on-error: true

      - name: 日次平均価格を履歴に追記
        run: node scripts/scrape/append-history.mjs
        continue-on-error: true

      # 平均だけでは「この店が先週いくらだったか」が出せないので、社別も残す。
      - name: 社別の価格を履歴に追記
        run: node scripts/scrape/append-company-history.mjs
        continue-on-error: true

      - name: 金先物の見通しを記録
        run: node scripts/scrape/record-futures-outlook.mjs
        continue-on-error: true

      # 円建ての金価格は「ドル建ての金価格 × ドル円」で決まる。為替を並べて記録しておくと、
      # その日の値動きのうち為替で説明できる分を後から出せる(/drivers)。
      - name: ドル円を記録
        run: node scripts/scrape/record-fx.mjs
        continue-on-error: true

      - name: 変更をコミット・push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 壊れたJSONをコミットしない。衝突マーカーが混ざっていればここで落とす。
          for f in data/*.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "$f が読めません"; exit 1; }
          done
          git add data/
          git diff --cached --quiet && echo "変更なし" || git commit -m "chore: 日次価格更新 $(date -u +%Y-%m-%d)"
          # 人間の作業中に走ると push が弾かれ、その日の取得ぶんが失われていた。
          # リベースしてから数回やり直す。
          #
          # 衝突したら、その場で中断して終わる。2026年10月8日に手元の定期実行が
          # 同じ書き方(|| true)で衝突を握りつぶし、data/companies.json に
          # 「<<<<<<< HEAD」が入ったままコミットしていた。JSONとして壊れるので、
          # push が通っていればサイトはビルドできなくなっていた。
          # 価格は次の回で取り直せる。半端な状態で進めるより、やめるほうがいい。
          for i in 1 2 3; do
            git push && exit 0
            echo "push に失敗しました。リベースして再試行します ($i/3)"
            if ! git pull --rebase --autostash origin main; then
              echo "リベースが衝突しました。中断します"
              git rebase --abort || true
              exit 1
            fi
            sleep 5
          done
          git push

      # ここまでの各ステップは continue-on-error なので、1社の取得が失敗しても
      # ジョブは緑のまま終わっていた。実際なんぼやの取得は10か月失敗し続け、
      # その間ずっと古い価格がサイトに並んでいた。ログに出すだけでは気づけない。
      # コミットの後に置くのは、点検で落としても当日取れた分は残したいため。
      - name: 取得結果を点検(失敗・古い価格があればジョブを落とす)
        if: always()
        run: node scripts/scrape/check-freshness.mjs

      # 2026年10月4日、人に言われて初めて全ページを手で点検した。その1回で9件の
      # 誤りが出た。つまりそれまでは、誰かが気づくまで出続ける状態だった。
      # 機械にできるぶんは毎日やらせる。
      #
      # 見るのは「いまこの瞬間に公開されているもの」。この直前のpushぶんは
      # まだビルド中のことが多いので、たいていは1つ前のビルドを調べることになる。
      # それでいい。今日の変更が本番に出ているかどうかは、ジョブの最初に走る
      # check-production.mjs が /build.json とHEADを突き合わせて別に見ている。
      - name: 公開中の全ページを点検
        if: always()
        run: node scripts/check-pages.mjs

      # 各社は予告なく書き換える。10月4日は買取エリートが「手数料￥０」から
      # 「相場価格に手数料は含まれておりません」へ変わっていて、意味が逆になっていた。
      # JSで描画していて取れない社があるため、ここでは落とさず報告だけにする。
      # 落とすと「取れないだけ」で毎日赤くなり、本当の食い違いが埋もれる。
      # 10月4日に誤りがいちばん多かったのは、対応地域と店舗数という
      # 人が転記した値だった。機械で正しさを判定しようとしたら15社中12社を
      # 誤検知したので、「合っているか」ではなく「いつ確かめたか」を見る。
      # 60日で催促、90日で落とす。誤りが出続けた原因は、間違えたことではなく
      # 見直す機会が無かったことなので、機会のほうを作る。
      - name: 手で入れた値が確かめられずに残っていないか
        if: always()
        run: node scripts/check-hand-data.mjs

      # OGP画像のフォントは、いま使っている文字だけに絞って同梱している。
      # 新しい記事で新しい漢字を使うと、エラーにならず豆腐(□)の画像ができる。
      # 共有されて初めて気づく崩れ方なので、文字のほうを先に確かめる。
      # JSXで日本語の文を折り返すと、画面では半角スペースになる。
      # 「ありません。 どの店も」のような空きが、コラム20本で448か所あった。
      # 1行24文字しか入らない画面では、これだけで文字が散らばって見える。
      - name: 日本語の文が途中で折り返されていないか
        if: always()
        run: node scripts/fix-jp-linebreaks.mjs --check

      - name: OGP画像のフォントに、記事タイトルの文字が入っているか
        if: always()
        run: node scripts/check-og-font.mjs

      - name: 引用が出典の原文と一致するかを照合
        if: always()
        continue-on-error: true
        run: node scripts/verify-quotes.mjs
