name: Daily price refresh

on:
  schedule:
    # 01:00 UTC = 10:00 JST。開店前に相場を確認したいユーザーのために早め設定。
    # リファスタ等、朝10:00ちょうどに更新する店舗があるため、これより早めると前日分の
    # 古い価格を拾うリスクが上がる。
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      # 1社の取得失敗が他社やこの後のコミットをブロックしないよう、各ステップは失敗しても続行する。
      - name: 各社の買取価格を取得
        run: node scripts/scrape/index.mjs
        continue-on-error: true

      - name: 田中貴金属の参考価格を取得
        run: node scripts/scrape/update-reference-rate.mjs
        continue-on-error: true

      - name: 日次平均価格を履歴に追記
        run: node scripts/scrape/append-history.mjs
        continue-on-error: true

      - name: 金先物の見通しを記録
        run: node scripts/scrape/record-futures-outlook.mjs
        continue-on-error: true

      - name: 変更をコミット・push
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "変更なし" || git commit -m "chore: 日次価格更新 $(date -u +%Y-%m-%d)"
          git push
